name: GIL Talk Demo

on: push

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        version: ["3.9", "3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "${{ matrix.version }}"
        allow-prereleases: true

    - name: Check Python version
      run: python -VV

    - name: Install dependencies
      run: pip install setuptools

    - name: Build C extension
      run: |
        python python_c_extension/setup.py build
        cp -r build/*/* python_c_extension

    - name: Run script in single and multi-thread mode
      run: python python_c_extension/c_extension_gil.py
      env:
        PYTHONPATH: "."
        PYTHON_GIL: 0

    - name: Run Tests
      run: python -m unittest discover tests/ -vvv
      env:
        PYTHON_GIL: 0

  build-freethreaded:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.8.0
      with:
        manifest-path: pixi.toml

    - name: Check Python version
      run: pixi run python -VV

    - name: Check GIL is disabled
      run: pixi run python -c "import sys; print('GIL enabled:', sys._is_gil_enabled())"
      env:
        PYTHON_GIL: 0

    - name: Build C extension
      run: |
        pixi run python python_c_extension/setup.py build
        cp -r build/*/* python_c_extension

    - name: Run script in single and multi-thread mode
      run: pixi run python python_c_extension/c_extension_gil.py
      env:
        PYTHONPATH: "."
        PYTHON_GIL: 0

    - name: Run Tests
      run: pixi run python -m unittest discover tests/ -vvv
      env:
        PYTHON_GIL: 0
